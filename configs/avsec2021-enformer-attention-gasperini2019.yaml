_name: avsec2021-enformer-attention-gasperini2019
_protocol: avsec2021
_comment: >-
  Avsec 2021 Fig 2b, attention arm, scored on the gasperini2019 CRISPRi
  screen.

  Major TSS by argmax predicted K562 CAGE; 3 bins at the TSS; sum of
  absolute scores in a 2 kb window at the enhancer; no logarithm and no
  normaliser.

  Sibling arms differ only in attribution method and screen. Attention is
  defined on bins, so the enhancer window is aggregated over whole 128 bp
  tokens rather than over base pairs.

model: enformer
replicates: 1
anchor: single-tss
tss_major: true
tss_major_assay: cage
pair_filters: {}
inverse_transform: false
assay: cage
cell_type: k562
strand_mask: auto
region: tss
tss_width: 384
readout_anchor: window-centre
bin_overlap: majority       # A 2 kb enhancer straddles 15 or 16 of the 128 bp
                            # tokens depending on where it falls on the grid,
                            # so the token count varies from pair to pair.
                            # `any` would give 16 or 17, `fixed` exactly 16.
track_agg: sum
log_scalar: false
abs_map: true
normalise: none
tta: none
tta_shift_bp: null
screen: gasperini2019
method: attention
enh_agg: sum
enh_span: 2000

tss_major_cell_type: null
bin_abs_order: after
track_abs_order: after
tta_abs_order: before
replicate_abs_order: before

seed: 0
