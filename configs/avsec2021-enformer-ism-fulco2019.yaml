_name: avsec2021-enformer-ism-fulco2019
_protocol: avsec2021
_comment: >-
  Avsec 2021 Fig 2b, ISM arm, scored on the fulco2019 CRISPRi screen.

  Major TSS by argmax predicted K562 CAGE; 3 bins at the TSS; sum of
  absolute scores in a 2 kb window at the enhancer; no logarithm and no
  normaliser.

  Sibling arms differ only in attribution method and screen; the agnostic
  pair also widens the readout from the two K562 CAGE tracks to all 638.

model: enformer
replicates: 1
anchor: single-tss
tss_major: true
tss_major_assay: cage
pair_filters: {}
inverse_transform: false
assay: cage
cell_type: k562
strand_mask: auto
region: tss
tss_width: 384
readout_anchor: window-centre
bin_overlap: any
track_agg: sum
log_scalar: false
abs_map: true
normalise: none
tta: none
tta_shift_bp: null
screen: fulco2019
method: ism
enh_agg: point
enh_span: null
ism_window: 2000
ism_mode: random-replace     # "Replaced by a random sequence" is read
                             # literally: random BASES, so the substituted
                             # region is still a valid one-hot. The competing
                             # reading, random-probs, draws random VALUES per
                             # channel; it is favoured by fulco2019 and
                             # disfavoured by gasperini2019, so the choice
                             # cannot be settled on one screen alone.
ism_shuffles: 1
ism_statistic: abs_mean_diff
ism_inner_mean: []

tss_major_cell_type: null
bin_abs_order: after
track_abs_order: after
tta_abs_order: before
replicate_abs_order: before

seed: 0
