_name: unified-t1-backbone-alphagenome-ism
_protocol: unified-t1
_comment: >-
  Unified protocol, tier-1, AlphaGenome ISM arm. The method axis of the
  cross-trunk protocol comparison, on the Gschwind K562 CRISPRi screen.

  Protocol: in-silico mutagenesis of the 2 kb window centred on each enhancer,
  ten dinucleotide shuffles scored by abs_mean_diff; single canonical TSS
  anchor; K562 CAGE summed over a 384 bp readout window; no augmentation.

  This is unified-t1-backbone-alphagenome with method=ism and nothing else
  chosen: enh_agg, normalise, gaussian_sigma and gaussian_truncate follow from
  it, because validate() refuses every other value once method=ism. Two keys
  are widened rather than forced: strand_mask keeps both K562 CAGE strands,
  and track_abs_order keeps a per-track axis in the stored draws, from which
  either reduction order is recoverable.
model: alphagenome
replicates: 1
replicate_abs_order: before       # inert at replicates=1; live on Borzoi

screen: gschwind                  # TIER 1 (held fixed)
anchor: single-tss                # TIER 1
tss_major: false                  # TIER 1. `true` is the tier-1 variation,
                                  # and it is circular: the major TSS is the
                                  # argmax of the model's own predicted CAGE.
tss_major_assay: null
tss_major_cell_type: null
pair_filters: {require_gene_in_annotation: True}

assay: cage                       # TIER 1
cell_type: k562                   # TIER 1
strand_mask: "off"                # QUOTED: bare off is boolean False in YAML
                                  # 1.1, which the validator rejects. `off`
                                  # keeps both K562 CAGE strands, so the draws
                                  # carry a track axis of size 2, not 1.
region: tss                       # TIER 1
tss_width: 384                    # TIER 2 (needs its own pass). 640 bp is
                                  # the tier-1 variation.
readout_anchor: window-centre   # inert at anchor=single-tss: the window
                                  # centre is the gene's own TSS.
bin_overlap: any
track_agg: mean
log_scalar: false
inverse_transform: false          # forced: AlphaGenome does not predict in a
                                  # squashed space, so `true` is refused.

method: ism                       # the one tier-1 axis under test
bin_abs_order: after
track_abs_order: before           # widened, not forced: only `before` keeps
                                  # a per-track axis in the stored draws, from
                                  # which both orders are recoverable at no
                                  # extra cost. `after` collapses them first.

abs_map: true
enh_agg: point                    # forced by method=ism: the perturbed
                                  # window is the enhancer window.
enh_span: null                    # forced: only sum/mean/max take a span
gaussian_sigma: null              # forced null: enh_agg is not gaussian
gaussian_truncate: null           # forced null: enh_agg is not gaussian
normalise: none                   # forced by method=ism: the ISM statistic
                                  # is already cross-gene calibrated.
anchor_agg: null                  # forced null at anchor=single-tss

tta: none
tta_shift_bp: null
tta_abs_order: before             # inert at tta=none

ism_window: 2000
ism_mode: dinuc-shuffle
ism_shuffles: 10
ism_statistic: abs_mean_diff
ism_inner_mean: []

seed: 0
