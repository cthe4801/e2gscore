_name: avsec2021-enformer-gradient-gasperini2019
_protocol: avsec2021
_comment: >-
  Avsec 2021 Fig 2b, gradient arm on gasperini2019.

  Major TSS by argmax predicted K562 CAGE; 3 bins at the TSS; sum of absolute
  scores in a 2 kb window at the enhancer; no logarithm and no normaliser.

model: enformer
replicates: 1
anchor: single-tss
tss_major: true
tss_major_assay: cage
pair_filters: {}
inverse_transform: false
assay: cage
cell_type: k562
strand_mask: auto
region: tss
tss_width: 384
readout_anchor: window-centre   # gene-tss would read at the annotated TSS
                                # rather than the major TSS chosen above.
bin_overlap: any
track_agg: sum
log_scalar: false
abs_map: true
normalise: none
tta: none
tta_shift_bp: null
screen: gasperini2019
method: gradient
enh_agg: sum
enh_span: 2000

tss_major_cell_type: null
bin_abs_order: after
track_abs_order: after
tta_abs_order: before
replicate_abs_order: before

seed: 0
